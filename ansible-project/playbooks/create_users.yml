---
- name: Create system users on all nodes
  hosts: managed_nodes
  become: true

  vars:
    users:
      - username: devuser
        comment: "Developer User"
      - username: opsuser
        comment: "Operations User"

  tasks:
    - name: Create each user
      user:
        name: "{{ item.username }}"
        comment: "{{ item.comment }}"
        shell: /bin/bash
        state: present
      loop: "{{ users }}"