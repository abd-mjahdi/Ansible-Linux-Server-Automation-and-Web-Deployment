---
- name: Install Apache on node1
  hosts: node1
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install apache2
      apt:
        name: apache2
        state: present

    - name: Ensure apache2 is started and enabled
      service:
        name: apache2
        state: started
        enabled: true